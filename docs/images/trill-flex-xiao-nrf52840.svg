<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: GPL-3.0-only. Original diagram for the nymble/trill project. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="645" viewBox="0 0 1040 645" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1040" height="645" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold">Trill Flex → Seeed Studio XIAO nRF52840 / nRF52840 Sense</text>
  <text x="20" y="54" font-size="13" fill="#b00020">Design proposal — not hardware-validated. Signals are identified by label, not by wire colour.</text>

  <!-- Flex sensor + base -->
  <rect x="20" y="170" width="150" height="56" rx="6" fill="#f3e2b3" stroke="#8a6d1f"/>
  <path d="M30 183 l10 15 l-10 15 M50 183 l10 15 l-10 15 M70 183 l10 15 l-10 15 M90 183 l10 15 l-10 15 M110 183 l10 15 l-10 15 M130 183 l10 15 l-10 15" fill="none" stroke="#8a6d1f" stroke-width="1.5"/>
  <rect x="170" y="186" width="30" height="24" fill="#f3e2b3" stroke="#8a6d1f"/>
  <text x="20" y="246" font-size="12">Flex sensor, chevrons up</text>
  <rect x="200" y="120" width="200" height="160" rx="8" fill="#e8eef7" stroke="#2b4a7a" stroke-width="2"/>
  <rect x="200" y="184" width="14" height="28" fill="#555"/>
  <text x="212" y="144" font-weight="bold">Trill Flex base</text>
  <text x="212" y="162" font-size="12" fill="#555">addr 0x48 · no pull-ups</text>
  <rect x="340" y="196" width="60" height="70" fill="#fff" stroke="#2b4a7a"/>
  <text x="330" y="192" font-size="11" fill="#2b4a7a">QWIIC (JST SH)</text>
  <text x="348" y="213" font-size="12">1 GND</text>
  <text x="348" y="228" font-size="12">2 VCC</text>
  <text x="348" y="243" font-size="12">3 SDA</text>
  <text x="348" y="258" font-size="12">4 SCL</text>

  <!-- XIAO board, front view, USB-C up -->
  <g>
    <rect x="700" y="110" width="200" height="300" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <rect x="770" y="96" width="60" height="26" rx="6" fill="#9e9e9e" stroke="#555"/>
    <text x="781" y="114" font-size="11" fill="#fff">USB-C</text>
    <text x="800" y="398" font-size="12" fill="#1565c0" text-anchor="middle">front (component side)</text>
    <!-- left pins 1..7 -->
    <g font-size="12">
      <circle cx="712" cy="150" r="7" fill="#fff" stroke="#000"/><text x="724" y="155">1 D0</text>
      <circle cx="712" cy="185" r="7" fill="#fff" stroke="#000"/><text x="724" y="190">2 D1</text>
      <circle cx="712" cy="220" r="7" fill="#fff" stroke="#000"/><text x="724" y="225">3 D2</text>
      <circle cx="712" cy="255" r="7" fill="#fff" stroke="#000"/><text x="724" y="260">4 D3</text>
      <circle cx="712" cy="290" r="7" fill="#fff" stroke="#1b7f3a" stroke-width="2"/><text x="724" y="295" fill="#1b7f3a">5 D4 / SDA (P0.04)</text>
      <circle cx="712" cy="325" r="7" fill="#fff" stroke="#6a1b9a" stroke-width="2"/><text x="724" y="330" fill="#6a1b9a">6 D5 / SCL (P0.05)</text>
      <circle cx="712" cy="360" r="7" fill="#fff" stroke="#000"/><text x="724" y="365">7 D6</text>
      <!-- right pins 14..8 -->
      <circle cx="888" cy="150" r="7" fill="#ddd" stroke="#999"/><text x="830" y="155" text-anchor="start">14 5V</text>
      <circle cx="888" cy="185" r="7" fill="#fff" stroke="#000" stroke-width="2"/><text x="826" y="190">13 GND</text>
      <circle cx="888" cy="220" r="7" fill="#fff" stroke="#d32f2f" stroke-width="2"/><text x="826" y="225" fill="#d32f2f">12 3V3</text>
      <circle cx="888" cy="255" r="7" fill="#fff" stroke="#000"/><text x="830" y="260">11 D10</text>
      <circle cx="888" cy="290" r="7" fill="#fff" stroke="#000"/><text x="838" y="295">10 D9</text>
      <circle cx="888" cy="325" r="7" fill="#fff" stroke="#000"/><text x="846" y="330">9 D8</text>
      <circle cx="888" cy="360" r="7" fill="#fff" stroke="#000"/><text x="846" y="365">8 D7</text>
    </g>
    <text x="800" y="428" font-size="12" text-anchor="middle">pin 14 (5V / VBUS): do not connect to Trill</text>
  </g>

  <!-- Wires -->
  <g fill="none" stroke-width="3">
    <!-- GND: Trill pin1 to XIAO pin13 (right side), routed over the top -->
    <polyline points="400,209 470,209 470,80 960,80 960,185 895,185" stroke="#000"/>
    <!-- VCC: Trill pin2 to 3V3 pin12 -->
    <polyline points="400,224 490,224 490,95 945,95 945,220 895,220" stroke="#d32f2f"/>
    <!-- SDA to D4 -->
    <polyline points="400,239 640,239 640,290 705,290" stroke="#1b7f3a"/>
    <!-- SCL to D5 -->
    <polyline points="400,254 620,254 620,325 705,325" stroke="#6a1b9a"/>
  </g>

  <!-- Pull-up resistors to 3V3 rail -->
  <g>
    <line x1="530" y1="95" x2="530" y2="130" stroke="#d32f2f" stroke-width="2"/>
    <line x1="580" y1="95" x2="580" y2="130" stroke="#d32f2f" stroke-width="2"/>
    <rect x="522" y="130" width="16" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="572" y="130" width="16" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="530" y1="180" x2="530" y2="239" stroke="#1b7f3a" stroke-width="2"/>
    <circle cx="530" cy="239" r="4" fill="#1b7f3a"/>
    <line x1="580" y1="180" x2="580" y2="254" stroke="#6a1b9a" stroke-width="2"/>
    <circle cx="580" cy="254" r="4" fill="#6a1b9a"/>
    <circle cx="530" cy="95" r="4" fill="#d32f2f"/>
    <circle cx="580" cy="95" r="4" fill="#d32f2f"/>
    <text x="500" y="160" font-size="12" text-anchor="end">R1</text>
    <text x="596" y="150" font-size="12">R2</text>
    <text x="596" y="166" font-size="12">4.7 kΩ each</text>
    <text x="596" y="182" font-size="12">to 3V3</text>
  </g>
  <g font-size="12">
    <text x="410" y="204">GND</text>
    <text x="596" y="118" fill="#d32f2f">3V3</text>
    <text x="410" y="272" fill="#1b7f3a">SDA</text>
    <text x="450" y="272" fill="#6a1b9a">SCL</text>
  </g>

  <!-- Notes -->
  <g font-size="13">
    <rect x="20" y="446" width="1000" height="180" rx="8" fill="#fafafa" stroke="#bbb"/>
    <text x="36" y="472" font-weight="bold">Connections</text>
    <text x="36" y="494">Trill 1 GND → XIAO GND (13)   ·   Trill 2 VCC → XIAO 3V3 (12)   ·   Trill 3 SDA → XIAO D4 (5, P0.04)   ·   Trill 4 SCL → XIAO D5 (6, P0.05)</text>
    <text x="36" y="522" font-weight="bold">Electrical</text>
    <text x="36" y="544">nRF52840 I/O: VDD 3.0 V nominal, 3.6 V max; never apply 5 V to D4/D5. Power Trill from 3V3 (≈4 mA typical per Bela datasheet).</text>
    <text x="36" y="566">Seeed schematic (v1.2) shows no pull-ups on D4/D5 (the 10 kΩ pull-ups R14/R15 belong to the internal IMU bus). Fit R1/R2 unless a</text>
    <text x="36" y="584">Trill Hub (2.2 kΩ) or other board on the bus already provides them. nRF internal pull-ups (11–16 kΩ) are too weak to rely on.</text>
    <text x="36" y="610" font-size="11" fill="#777">Bus: TWIM 100/250/400 kHz; Trill supports 50/100/400 kHz. Diagram colours are a signal key only. Trademarks belong to their owners; no affiliation.</text>
  </g>
</svg>
