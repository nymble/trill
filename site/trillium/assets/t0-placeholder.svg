<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 20 480 380" width="480" height="380" role="img" aria-label="Trillium Zero: a XIAO nRF52840 Sense board on the end of a USB-C cable (line drawing, photo to come)">
  <rect width="800" height="450" fill="#0C0C0D"/>
  <!-- cable -->
  <path d="M400 168 C400 110 430 80 500 70 S700 40 800 40" fill="none" stroke="#55524D" stroke-width="16" stroke-linecap="round"/>
  <!-- USB-C plug -->
  <rect x="378" y="150" width="44" height="48" rx="8" fill="#232326" stroke="#8A8580" stroke-width="3"/>
  <!-- board: 21 x 17.5 mm -->
  <rect x="295" y="196" width="210" height="175" rx="14" fill="#232326" stroke="#B3ADA4" stroke-width="3"/>
  <!-- shield can -->
  <rect x="340" y="250" width="120" height="80" rx="6" fill="none" stroke="#8A8580" stroke-width="3"/>
  <!-- castellated pads -->
  <g fill="#8A8580">
    <rect x="289" y="222" width="12" height="10" rx="2"/><rect x="289" y="246" width="12" height="10" rx="2"/><rect x="289" y="270" width="12" height="10" rx="2"/><rect x="289" y="294" width="12" height="10" rx="2"/><rect x="289" y="318" width="12" height="10" rx="2"/><rect x="289" y="342" width="12" height="10" rx="2"/>
    <rect x="499" y="222" width="12" height="10" rx="2"/><rect x="499" y="246" width="12" height="10" rx="2"/><rect x="499" y="270" width="12" height="10" rx="2"/><rect x="499" y="294" width="12" height="10" rx="2"/><rect x="499" y="318" width="12" height="10" rx="2"/><rect x="499" y="342" width="12" height="10" rx="2"/>
  </g>
  <!-- motion, in signal orange -->
  <path d="M560 300 a60 60 0 0 0 -40 -70" fill="none" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round"/>
  <path d="M240 300 a60 60 0 0 1 40 -70" fill="none" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round"/>
</svg>
