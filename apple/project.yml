# SPDX-License-Identifier: GPL-3.0-only
# XcodeGen spec (pinned XcodeGen 2.45.4, see docs/apple-app.md). The
# generated Trillium.xcodeproj is not committed: run `make apple-project`.
name: Trillium
options:
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  TrillKit:
    path: TrillKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: Trillium
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  TrilliumMac:
    type: application
    platform: macOS
    sources:
      - App/Shared
    dependencies:
      - package: TrillKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRILL_BUNDLE_ID)
        INFOPLIST_FILE: App/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/macOS/Trillium.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
  TrilliumIOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
    dependencies:
      - package: TrillKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRILL_BUNDLE_ID)
        INFOPLIST_FILE: App/iOS/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  TrilliumMac:
    build:
      targets:
        TrilliumMac: all
  TrilliumIOS:
    build:
      targets:
        TrilliumIOS: all
