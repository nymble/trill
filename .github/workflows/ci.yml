name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: fmt, clippy, test, thumbv7em check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add thumbv7em-none-eabihf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: no_std libraries for Cortex-M4F (nRF52840)
        run: cargo build -p trill-driver -p lsm6ds3trc -p motion-synth -p status-led -p instrument-events -p trill-usb -p trill-config --target thumbv7em-none-eabihf --locked
      - name: Protocol vectors are current (shared with the Swift tests)
        run: |
          cargo run -q --locked -p trill-config --example vectors > /tmp/vectors.txt
          diff -u protocol/config-v1-vectors.txt /tmp/vectors.txt
          cargo run -q --locked -p trill-config --example vectors -- telemetry > /tmp/telemetry.txt
          diff -u protocol/telemetry-v1-frames.txt /tmp/telemetry.txt
      - name: Tool tests (UF2 safety checks, PCM stream parser)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Motion synth demo render
        run: cargo run --release --locked -p motion-synth --example render_wav -- /tmp/motion-synth-demo.wav
      - name: Makefile parses
        run: make --dry-run ci pi-zero dist fw-uf2 synth-demo protocol-vectors apple test-kit >/dev/null

  firmware:
    name: XIAO nRF52840 Sense firmware (link + UF2 check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add thumbv7em-none-eabihf
      - name: fmt
        working-directory: firmware/xiao-sense
        run: cargo fmt -- --check
      - name: clippy (default USB-MIDI, pcm-synth, timing-gpio)
        working-directory: firmware/xiao-sense
        run: |
          cargo clippy --release --locked -- -D warnings
          cargo clippy --release --locked --features pcm-synth -- -D warnings
          cargo clippy --release --locked --features pcm-synth,timing-gpio -- -D warnings
      - name: Link release ELF (default USB-MIDI + diagnostics)
        working-directory: firmware/xiao-sense
        run: cargo build --release --locked
      - name: Memory layout
        run: readelf -lW firmware/xiao-sense/target/thumbv7em-none-eabihf/release/xiao-sense-fw
      - name: Application-only UF2 (validated, artifact only)
        run: |
          mkdir -p dist
          python3 tools/xiao_uf2.py convert firmware/xiao-sense/target/thumbv7em-none-eabihf/release/xiao-sense-fw -o dist/xiao-sense-fw.uf2
          python3 tools/xiao_uf2.py inspect dist/xiao-sense-fw.uf2
          cp firmware/xiao-sense/target/thumbv7em-none-eabihf/release/xiao-sense-fw dist/xiao-sense-fw.elf
      - name: Link release ELF (optional pcm-synth debug build)
        working-directory: firmware/xiao-sense
        run: cargo build --release --locked --features pcm-synth
      - name: PCM debug UF2 (validated, artifact only)
        run: |
          readelf -lW firmware/xiao-sense/target/thumbv7em-none-eabihf/release/xiao-sense-fw
          python3 tools/xiao_uf2.py convert firmware/xiao-sense/target/thumbv7em-none-eabihf/release/xiao-sense-fw -o dist/xiao-sense-fw-pcm-synth.uf2
          python3 tools/xiao_uf2.py inspect dist/xiao-sense-fw-pcm-synth.uf2
          cp firmware/xiao-sense/target/thumbv7em-none-eabihf/release/xiao-sense-fw dist/xiao-sense-fw-pcm-synth.elf
          (cd dist && sha256sum *.uf2 *.elf > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: xiao-sense-fw-unvalidated-on-hardware
          path: dist/
          retention-days: 14

  apple:
    name: Apple apps (macOS + iOS, unsigned) and TrillKit tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XCODEGEN_VERSION: 2.45.4
      # SHA-256 of xcodegen.zip, matching the digest GitHub publishes for the release asset.
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: TrillKit tests on macOS (protocol vectors, model, UF2 checks, CoreMIDI loopback)
        run: make apple-test
      - name: TrillKit tests on the iOS Simulator
        run: make apple-test-ios-sim
      - name: Generate Xcode project
        run: make apple-project && xcodegen --version
      - name: Build macOS app (Release, universal, unsigned)
        run: make apple-mac
      - name: Build iOS app for the Simulator
        run: make apple-ios-sim
      - name: Build iOS app for devices (compile check, unsigned, not installable)
        run: make apple-ios-device
      - name: Package and inspect
        run: |
          make apple-dist
          app=build/apple/Build/Products/Release/Trill.app
          lipo -info "$app/Contents/MacOS/Trill"
          plutil -p "$app/Contents/Info.plist"
          codesign -dv "$app" 2>&1 || true
          unzip -l dist/apple/Trill-iOS-Simulator-*.zip | tail -n 3
      - uses: actions/upload-artifact@v4
        with:
          name: trill-apple-apps-unsigned-dev
          path: dist/apple/
          retention-days: 14

  test-kit:
    name: Test kit (Mac app + matching firmware, one commit)
    runs-on: ubuntu-latest
    needs: [firmware, apple]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: trill-apple-apps-unsigned-dev
          path: in/apple
      - uses: actions/download-artifact@v4
        with:
          name: xiao-sense-fw-unvalidated-on-hardware
          path: in/fw
      - name: Package (no build, inputs verified against their SHA256SUMS)
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          (cd in/apple && sha256sum -c SHA256SUMS)
          (cd in/fw && sha256sum -c SHA256SUMS)
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          make test-kit KIT_SHA="${SHA::7}" KIT_APP="in/apple/Trill-macOS-unsigned-dev-$v.zip" KIT_UF2=in/fw/xiao-sense-fw.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: trill-test-kit-unsigned-dev
          path: dist/Trill-*.zip
          retention-days: 14

  cross:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: host
    strategy:
      fail-fast: false
      matrix:
        target:
          - arm-unknown-linux-musleabihf
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust and Zig toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          python3 -m pip install ziglang==0.17.0.post0
          cargo install --locked cargo-zigbuild@0.23.4
      - run: cargo zigbuild --release --locked -p trill-cli --target ${{ matrix.target }}
      - name: Inspect binary
        run: readelf -h -A target/${{ matrix.target }}/release/trill | grep -E 'Machine|Tag_CPU_arch' || true
