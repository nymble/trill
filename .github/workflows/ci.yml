name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: fmt, clippy, test, thumbv7em check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add thumbv7em-none-eabihf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Driver compile check for Cortex-M4F (nRF52840)
        run: cargo build -p trill-driver --target thumbv7em-none-eabihf --locked
      - name: Makefile parses
        run: make --dry-run ci pi-zero dist >/dev/null

  cross:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: host
    strategy:
      fail-fast: false
      matrix:
        target:
          - arm-unknown-linux-musleabihf
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust and Zig toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          python3 -m pip install ziglang==0.17.0.post0
          cargo install --locked cargo-zigbuild@0.23.4
      - run: cargo zigbuild --release --locked -p trill-cli --target ${{ matrix.target }}
      - name: Inspect binary
        run: readelf -h -A target/${{ matrix.target }}/release/trill | grep -E 'Machine|Tag_CPU_arch' || true
