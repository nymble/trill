[package]
name = "xiao-sense-fw"
description = "Embassy firmware for the Seeed XIAO nRF52840 Sense: class-compliant USB-MIDI + CDC diagnostics from Trill touch and LSM6DS3TR-C motion; microphone test PCM stream; optional debug synth"
version = "0.8.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/nymble/trill"
authors = ["Nymble (https://github.com/nymble)"]
rust-version = "1.85"
publish = false

[[bin]]
name = "xiao-sense-fw"
path = "src/main.rs"
test = false
bench = false

[dependencies]
trill-driver = { path = "../../crates/trill-driver" }
lsm6ds3trc = { path = "../../crates/lsm6ds3trc" }
motion-synth = { path = "../../crates/motion-synth" }
status-led = { path = "../../crates/status-led" }
instrument-events = { path = "../../crates/instrument-events" }
trill-usb = { path = "../../crates/trill-usb" }
trill-config = { path = "../../crates/trill-config" }
trill-board = { path = "../../crates/trill-board" }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "time", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
static_cell = "2.1.1"
embedded-hal = "1.0.0"
embassy-usb = { version = "0.6.0", default-features = false }
# Critical sections come from src/cs.rs (single-core) or, in the
# `ble-midi` build, from nrf-softdevice (masks application interrupts only).
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
critical-section = { version = "1.2", features = ["restore-state-bool"] }
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
heapless = "0.9"
ble-midi = { path = "../../crates/ble-midi", optional = true }
embedded-storage-async = { version = "0.4.1", optional = true }
# Uses the S140 7.3.0 SoftDevice that the factory bootloader already keeps
# in flash; nothing here writes it. Pinned to a reviewed commit.
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", rev = "b0ac850c0a5a05b8a5aef4f752b48115755b8542", default-features = false, features = ["nrf52840", "s140", "ble-peripheral", "ble-gatt-server", "critical-section-impl", "usable-from-interrupts"], optional = true }

[features]
default = []
# Debug/test path: on-board synth rendered on the high-priority executor and
# streamed as framed PCM over the same CDC ACM port as the microphone test
# (tools/pcm_capture.py). Shares USB PID 1209:0003. Microphone samples
# take the port while the test switch is on.
pcm-synth = []
# Logic-analyser timing outputs on D0/D1 (see src/timing.rs). Off by default.
timing-gpio = []
# MIDI over Bluetooth LE (docs/ble-midi.md): enables the S140 SoftDevice
# already in flash and advertises the standard BLE-MIDI service alongside
# USB MIDI. Links with link/memory-ble.x (RAM below 0x20008000 is the
# SoftDevice's). For battery boards (T1 and up); published as a separate
# app-only UF2.
ble-midi = ["dep:nrf-softdevice", "dep:ble-midi", "dep:embedded-storage-async"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2          # symbols stay in the ELF only; not in the UF2/bin
panic = "abort"

[profile.dev]
opt-level = "s"
debug = 2
panic = "abort"
