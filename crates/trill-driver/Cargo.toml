[package]
name = "trill-driver"
description = "no_std embedded-hal 1.0 driver for Bela Trill capacitive touch sensors (independent implementation)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = "1.81"
readme = "README.md"
keywords = ["trill", "capacitive", "touch", "embedded-hal", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]
publish = false

[dependencies]
embedded-hal = "1.0.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1"] }
